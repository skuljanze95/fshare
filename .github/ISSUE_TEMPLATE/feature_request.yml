name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution. "When I share X with Y, I can't …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: agents
    attributes:
      label: Context
      options:
        - label: This is about using fshare from an AI agent (Claude Code, Codex, Cursor, …)
