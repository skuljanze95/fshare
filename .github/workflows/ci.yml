name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds dist/ first, then runs the unit and process tests (no network needed).
      - run: npm test

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack and run the tarball like a user would
        run: |
          npm pack
          TARBALL=$(ls skuljanze-fshare-*.tgz)
          tar -tzf "$TARBALL"
          npx --yes "./$TARBALL" --version
          npx --yes "./$TARBALL" --help
          npx --yes "./$TARBALL" list --json

  windows:
    name: Windows (best effort)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests that need the fake cloudflared or POSIX signals are skipped on Windows.
      - run: npm test
      - name: Install cloudflared
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cloudflared'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile (Join-Path $dir 'cloudflared.exe')
          Add-Content $env:GITHUB_PATH $dir
      - name: Pack and run the tarball like a user would
        shell: bash
        run: |
          npm pack
          TARBALL=$(ls skuljanze-fshare-*.tgz)
          npx --yes "./$TARBALL" --version
          npx --yes "./$TARBALL" list --json
          npx --yes "./$TARBALL" doctor
      - name: End-to-end (real Cloudflare quick tunnel)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run e2e

  e2e:
    name: End-to-end (real Cloudflare quick tunnel)
    # Quick tunnels have no SLA and are rate-limited, so run this on main only and never block on it.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install cloudflared
        run: |
          curl -fsSLO https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared --version
      - run: npm run e2e
